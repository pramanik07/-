<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেত্নী - Cute Jewelry</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nirmala UI', sans-serif;}
    body {background: #fff0f5; color: #4a004a;}
    
    .hero {
      background: linear-gradient(135deg, #ffe6f0 0%, #e6ccff 100%);
      padding: 80px 20px;
      text-align: center;
    }
    .hero h1 {
      font-size: 6rem; /* একদম বড় করে */
      color: #ff66cc;
      text-shadow: 0 0 25px #ffb3e6;
      letter-spacing: 8px;
    }
    .hero p {font-size: 1.4rem; margin-top: 15px; color: #660066;}
    
    .product {
      padding: 50px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }
    .card {
      background: #fff;
      width: 280px;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(255,102,204,0.2);
      text-align: center;
    }
    .card img {width: 100%; height: 280px; object-fit: cover; border-radius: 15px;}
    .card h3 {margin: 10px 0; color: #ff66cc;}
    .price {font-size: 1.8rem; font-weight: bold; color: #E2136E;}
    
    .order {
      background: #fff;
      margin: 40px 20px;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
    }
    .order h2 {color: #ff66cc; margin-bottom: 20px; font-size:2rem;}
