<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেত্নী - Cute Jewelry</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nirmala UI', sans-serif;}
    body {background: #fff0f5; color: #4a004a;}
    
    .hero {
      background: linear-gradient(135deg, #ffe6f0 0%, #e6ccff 100%);
      padding: 70px 20px;
      text-align: center;
    }
    .hero h1 {
      font-size: 5rem; /* বড় করে */
      color: #ff66cc;
      text-shadow: 0 0 20px #ffb3e6;
      letter-spacing: 5px;
    }
    .hero p {font-size: 1.3rem; margin-top: 10px; color: #660066;}
    
    .product {
      padding: 50px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }
    .card {
      background: #fff;
      width: 280px;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(255,102,204,0.2);
      text-align: center;
    }
    .card img {width: 100%; height: 280px; object-fit: cover; border-radius: 15px;}
    .card h3 {margin: 10px 0; color: #ff66cc;}
    .price {font-size: 1.6rem; font-weight: bold; color: #E2136E;}
    
    .order {
      background: #fff;
      margin: 40px 20px;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
    }
    .order h2 {color: #ff66cc; margin-bottom: 20px;}
    .btn {
      display: inline-block;
      background: #ff66cc;
      color: #fff;
      padding: 15px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      margin: 8px;
    }
    .bkash {background: #E2136E;}
    .cod {background: #28a745;}
    
    .footer {text-align: center; padding: 20px; font-size: 0.9rem;}
  </style>
</head>
<body>

  <section class="hero">
    <h1>👻 পেত্নী 👻</h1>
    <p>কিউট মেয়েদের জন্য কিউট গয়না 💕</p>
  </section>

  <section class="product">
    <div class="card">
      <img src="https://i.ibb.co.com/4gB5W8q/ring.jpg" alt="Heart Ring">
      <h3>হার্ট শেপ রিং</h3>
      <p class="price">৳ 450</p>
    </div>
    <div class="card">
      <img src="https://i.ibb.co.com/2kQ1X9m/earring.jpg" alt="Pearl Earring">
      <h3>পার্ল ইয়ারিং</h3>
      <p class="price">৳ 450</p>
    </div>
    <div class="card">
      <img src="https://i.ibb.co.com/0XJ0v1L/necklace.jpg" alt="Necklace">
      <h3>কিউট নেকলেস</h3>
      <p class="price">৳ 450</p>
    </div>
  </section>

  <section class="order">
    <h2>অর্ডার করুন এখনই</h2>
    <p><b>২ টা অপশন আছে:</b></p>
    <a href="https://wa.me/8801312101940?text=আমি অর্ডার করতে চাই" class="btn cod">1. ক্যাশ অন ডেলিভারি</a>
    <a href="https://wa.me/8801312101940?text=আমি বিকাশে পেমেন্ট করব" class="btn bkash">2. বিকাশ পেমেন্ট</a>
