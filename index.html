<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেত্নী | Petni Jewelry</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
    *{margin:0; padding:0; box-sizing:border-box;}
    
    body{
      font-family:'Hind Siliguri', sans-serif; 
      color:#333;
      /* এখানে তোমার ছবিটা */
      background: url('https://i.ibb.co/1870398114371374/petni-cute-girl.png') no-repeat center top fixed;
      background-size: contain;
      background-color: #FFF5F9;
      background-attachment: fixed;
    }
    
    .overlay{background: rgba(255, 245, 249, 0.88); min-height: 100vh;}

    header{background:linear-gradient(90deg,rgba(255,102,179,0.95),rgba(255,51,153,0.95)); color:#fff; padding:25px; text-align:center; backdrop-filter: blur(5px); margin-top:300px;}
    header h1{font-size:2.8rem;}
    header p{font-size:1.1rem; margin-top:5px;}
    
    .container{max-width:1200px; margin:auto; padding:40px 15px;}
    .products{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:30px;}
    
    .card{background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 8px 25px rgba(255,102,179,0.25); transition:0.4s; border:2px solid #FFE0F0;}
    .card:hover{transform:translateY(-8px) scale(1.02);}
    .card img{width:100%; height:350px; object-fit:cover;}
    .card-body{padding:20px;}
    .category{font-size:0.9rem; color:#FF66B3; font-weight:600;}
    .title{font-size:1.3rem; font-weight:700; margin:8px 0;}
    .price{font-size:1.5rem; font-weight:800; color:#FF0099; margin-bottom:15px;}
    .btn-order{width:100%; padding:16px; border:none; border-radius:12px; font-size:1.1rem; font-weight:800; cursor:pointer; background:linear-gradient(90deg,#FF66B3,#FF3399); color:#fff;}
    
    .form-section{background:rgba(255,255,255,0.95); padding:40px 25px; margin-top:60px; border-radius:20px; box-shadow:0 8px 25px rgba(255,102,179,0.2); border:2px solid #FFE0F0; backdrop-filter: blur(8px);}
    .form-section h2{margin-bottom:25px; color:#FF0099; border-bottom:3px solid #FF66B3; padding-bottom:10px; text-align:center;}
    .form-group{margin-bottom:18px;}
    .form-group label{display:block; font-weight:700; margin-bottom:6px; color:#FF3399;}
    .form-group input, .form-group select{width:100%; padding:14px; border:2px solid #FFE0F0; border-radius:12px; font-size:1rem; background:#FFF5F9;}
    
    .cod-box{background:#FFE0F0; padding:15px; border-radius:12px; text-align:center; margin:20px 0; font-weight:700; color:#FF0099;}
    
    .place-order{width:100%; padding:18px; background:linear-gradient(90deg,#25D366,#20B954); color:#fff; border:none; border-radius:15px; font-size:1.3rem; font-weight:800; margin-top:20px; cursor:pointer;}
    
    .whatsapp{position:fixed; bottom:20px; right:20px; background:#25D366; width:65px; height:65px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 5px 20px rgba(37,211,102,0.5);}
    
    footer{background:linear-gradient(90deg,rgba(255,102,179,0.95),rgba(255,51,153,0.95)); color:#fff; text-align:center; padding:25px; margin-top:60px; font-weight:600; backdrop-filter: blur(5px);}
  </style>
</head>
<body>
<div class="overlay">

<header>
  <h1>👻 পেত্নী JEWELRY 👻</h1>
  <p>Cash On Delivery সারা বাংলাদেশে</p>
</header>

<div class="container">
  <div class="products">
    <div class="card">
      <img src="https://i.ibb.co.com/4gB5W8q/ring.jpg">
      <div class="card-body">
        <div class="category">Bridal Collection</div>
        <div class="title">Silver Leaf Vine Zircon Set</div>
        <div class="price">1,350.00৳</div>
        <button class="btn-order" onclick="buyNow('Silver Leaf Vine Zircon Set', 1350)">ORDER NOW</button>
      </div>
    </div>

    <div class="card">
      <img src="https://i.ibb.co.com/2kQ1X9m/earring.jpg">
      <div class="card-body">
        <div class="category">Jewellery Sets</div>
        <div class="title">Gold Teardrop Filigree Set</div>
        <div class="price">1,850.00৳</div>
        <button class="btn-order" onclick="buyNow('Gold Teardrop Filigree Set', 1850)">ORDER NOW</button>
      </div>
    </div>
  </div>

  <div class="form-section" id="orderForm" style="display:none;">
    <h2>অর্ডার কনফার্ম করুন 📝</h2>
