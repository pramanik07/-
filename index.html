<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORLENA - Elegant Jewelry Collection</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f8f6f2;
  color:#222;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  background:white;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:32px;
  letter-spacing:8px;
  font-family:serif;
}

.cart-btn{
  border:none;
  background:#111;
  color:white;
  padding:12px 18px;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
}

.hero{
  text-align:center;
  padding:60px 20px;
  background:#e8e1d8;
}

.hero h1{
  font-size:42px;
  font-family:serif;
  margin-bottom:15px;
}

.hero p{
  font-size:20px;
}

.products{
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

.product{
  background:white;
  padding:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.product h2{
  margin:15px 0 10px;
}

.old-price{
  text-decoration:line-through;
  color:#888;
}

.price{
  font-size:28px;
  margin:10px 0;
}

button{
  cursor:pointer;
}

.add-cart{
  width:100%;
  padding:14px;
  font-size:18px;
  background:white;
  border:1px solid #222;
}

/* Cart */

.cart-panel{
  position:fixed;
  top:0;
  right:-100%;
  width:100%;
  max-width:400px;
  height:100vh;
  background:white;
  z-index:100;
  padding:25px;
  transition:.3s;
  overflow:auto;
  box-shadow:-3px 0 20px rgba(0,0,0,.2);
}

.cart-panel.active{
  right:0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  padding-bottom:15px;
  border-bottom:1px solid #ddd;
}

.checkout-btn{
  width:100%;
  background:#111;
  color:white;
  border:none;
  padding:16px;
  font-size:18px;
  margin-top:20px;
}

.close-btn{
  float:right;
  border:none;
  background:#eee;
  padding:8px 12px;
}

/* Checkout */

.checkout{
  display:none;
  max-width:600px;
  margin:30px auto;
  padding:25px;
  background:white;
}

.checkout input,
.checkout textarea{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ccc;
  font-size:16px;
}

.payment-btn{
  width:100%;
  padding:16px;
  margin:10px 0;
  border:none;
  color:white;
  font-size:18px;
  border-radius:8px;
}

.bkash{
  background:#e2136e;
}

.nagad{
  background:#f58220;
}

.payment-info{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#f5f5f5;
  text-align:center;
}

.confirm-btn{
  width:100%;
  padding:16px;
  margin-top:15px;
  background:#111;
  color:white;
  border:none;
  font-size:18px;
}
</style>
</head>

<body>

<header>
  <div class="logo">ORLENA</div>

  <button class="cart-btn" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>


<section class="hero">
  <h1>Elegant Jewelry Collection</h1>
  <p>নিজের সৌন্দর্যকে আরও বিশেষ করে তুলুন ✨</p>
</section>


<section class="products">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f">
    <h2>Celeste Teardrop Jewelry Set</h2>
    <p class="old-price">Tk 1080.00 BDT</p>
    <p class="price">Tk 840.00 BDT</p>

    <button class="add-cart"
    onclick="addToCart('Celeste Teardrop Jewelry Set',840)">
      Add to Cart
    </button>
  </div>


  <div class="product">
    <img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338">
    <h2>Bloom of Love Necklace</h2>
    <p class="old-price">Tk 680.00 BDT</p>
    <p class="price">Tk 520.00 BDT</p>

    <button class="add-cart"
    onclick="addToCart('Bloom of Love Necklace',520)">
      Add to Cart
    </button>
  </div>

</section>


<!-- CART -->

<div class="cart-panel" id="cartPanel">

  <button class="close-btn" onclick="closeCart()">✕</button>

  <h2>🛒 Your Cart</h2>

  <div id="cartItems"></div>

  <h3>Total: Tk <span id="total">0</span></h3>

  <button class="checkout-btn" onclick="showCheckout()">
    Checkout
  </button>

</div>


<!-- CHECKOUT -->

<div class="checkout" id="checkout">

<h2>Checkout</h2>

<input type="text" id="customerName"
placeholder="আপনার নাম">

<input type="text" id="customerPhone"
placeholder="মোবাইল নম্বর">

<textarea id="customerAddress"
placeholder="আপনার সম্পূর্ণ ঠিকানা"></textarea>


<h3>Payment Method</h3>

<button class="payment-btn bkash"
onclick="selectPayment('bkash')">
💗 Pay with bKash
</button>

<button class="payment-btn nagad"
onclick="selectPayment('nagad')">
🟠 Pay with Nagad
</button>


<div class="payment-info" id="paymentInfo">

<h3 id="paymentTitle"></h3>

<p id="paymentNumber"></p>

<p>পেমেন্ট করার পর Transaction ID লিখুন:</p>

<input type="text"
id="transactionId"
placeholder="Transaction ID">

<button class="confirm-btn"
onclick="confirmOrder()">
Confirm Order
</button>

</div>

</div>


<script>

let cart=[];


function addToCart(name,price){

  cart.push({
    name:name,
    price:price
  });

  updateCart();

  alert(name+" কার্টে যোগ করা হয়েছে!");
}


function updateCart(){

  document.getElementById("cartCount").innerText=
  cart.length;

  let items="";

  let total=0;

  cart.forEach((item,index)=>{

    items+=`

    <div class="cart-item">

    <div>
    <strong>${item.name}</strong>
    <br>
    Tk ${item.price}
    </div>

    <button onclick="removeItem(${index})">
    ❌
    </button>

    </div>

    `;

    total+=item.price;

  });

  document.getElementById("cartItems").innerHTML=items;

  document.getElementById("total").innerText=total;

}


function removeItem(index){

  cart.splice(index,1);

  updateCart();

}


function openCart(){

  document.getElementById("cartPanel")
  .classList.add("active");

}


function closeCart(){

  document.getElementById("cartPanel")
  .classList.remove("active");

}


function showCheckout(){

  if(cart.length===0){

    alert("আপনার কার্ট খালি!");

    return;

  }

  closeCart();

  document.getElementById("checkout")
  .style.display="block";

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


function selectPayment(method){

  let paymentInfo=
  document.getElementById("paymentInfo");

  paymentInfo.style.display="block";


  if(method==="bkash"){

    document.getElementById("paymentTitle")
    .innerText="💗 bKash Payment";

    document.getElementById("paymentNumber")
    .innerHTML=
    "Send Money to:<br><strong>01905386242</strong>";

  }


  if(method==="nagad"){

    document.getElementById("paymentTitle")
    .innerText="🟠 Nagad Payment";

    document.getElementById("paymentNumber")
    .innerHTML=
    "Send Money to:<br><strong>01905386242</strong>";

  }

}


function confirmOrder(){

  let name=
  document.getElementById("customerName").value;

  let phone=
  document.getElementById("customerPhone").value;

  let address=
  document.getElementById("customerAddress").value;

  let transaction=
  document.getElementById("transactionId").value;


  if(!name || !phone || !address || !transaction){

    alert("সব তথ্য পূরণ করুন!");

    return;

  }


  let total=cart.reduce(
    (sum,item)=>sum+item.price,
    0
  );


  alert(

`অর্ডার সফলভাবে সাবমিট হয়েছে!

নাম: ${name}

মোবাইল: ${phone}

মোট: Tk ${total}

Transaction ID: ${transaction}

আমরা আপনার অর্ডার যাচাই করে যোগাযোগ করবো।`

  );


  cart=[];

  updateCart();

  document.getElementById("checkout")
  .style.display="none";

}

</script>

</body>
</html>
